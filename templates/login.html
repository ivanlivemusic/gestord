<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LA COMANDA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --bg-color: #FFFFFF;
            --text-color: #333333;
            --card-bg: #F5F5F5;
            --input-bg: #FFFFFF;
            --border-color: #DDDDDD;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #E0E0E0;
            --card-bg: #2d2d2d;
            --input-bg: #3a3a3a;
            --border-color: #444444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        
        .login-box {
            background-color: var(--card-bg);
            color: var(--text-color);
        }
        
        input {
            background-color: var(--input-bg);
            color: var(--text-color);
            border-color: var(--border-color);
        }
        
        #theme-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: rgba(0,0,0,0.1);
            font-size: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <button id="theme-toggle">
        <span class="theme-icon">🌙</span>
    </button>
    
    <div class="login-container">
        <div class="login-box">
            <h1>🍽️ LA COMANDA</h1>
            <h2>Sistema Gestione Ordini</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Username" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Accedi</button>
                
                <div id="errorMessage" class="error-message"></div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/menu';
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Errore di connessione';
                errorDiv.style.display = 'block';
            }
        });
        
        // Theme management
        const savedTheme = localStorage.getItem('lacomanda_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        document.getElementById('theme-toggle').addEventListener('click', function() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('lacomanda_theme', newTheme);
            this.querySelector('.theme-icon').textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        // Set initial icon
        document.querySelector('.theme-icon').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
    </script>
</body>
</html>
